[project]
name = "notification-service"
version = "0.1.0"
description = "Schedules and delivers fight notifications via channel adapters"
requires-python = ">=3.12"
dependencies = [
    "ufc-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notification_service"]
