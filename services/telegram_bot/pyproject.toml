[project]
name = "telegram-bot"
version = "0.1.0"
description = "User-facing Telegram bot: browse the card, subscribe to fights"
requires-python = ">=3.12"
dependencies = [
    "ufc-common",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_bot"]
