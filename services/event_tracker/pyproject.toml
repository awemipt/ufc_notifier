[project]
name = "event-tracker"
version = "0.1.0"
description = "Ingests fight lifecycle facts from pluggable sources and publishes them to the bus"
requires-python = ">=3.12"
dependencies = [
    "ufc-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["event_tracker"]
