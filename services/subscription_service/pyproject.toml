[project]
name = "subscription-service"
version = "0.1.0"
description = "Users, subscriptions, JWT auth, REST API"
requires-python = ">=3.12"
dependencies = [
    "ufc-common",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyjwt>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subscription_service"]
