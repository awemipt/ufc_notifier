description = "Canonical card model and fight ETA recalculation"
requires-python = ">=3.12"
dependencies = [
    "ufc-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schedule_engine"]
